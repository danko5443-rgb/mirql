# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# humanOnly (policy/paths.yaml): CodeRabbit is an aiReviewers account, so its
# Approve review can clear MP-001 in CI. request_changes_workflow makes it
# submit a real Approve once its comments are resolved, and Request changes
# while they are open.
reviews:
  request_changes_workflow: true
