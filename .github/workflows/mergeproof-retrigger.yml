name: Mergeproof Court

# The PR Court orchestrator (docs/pr-court.md). Every trigger here runs this
# file from main, and each one is only a wake-up: the engine rereads all state
# from the API. Code runs from base-notary only; candidate/ is read as text.
# pull_request_review must stay out of this file, because that event runs the
# PR's own copy of a workflow. It wakes the court through mergeproof-review-signal.yml.
on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Mergeproof External Notary", "Mergeproof Review Signal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to run the court on"
        required: true
        type: string

permissions: {}

concurrency:
  group: mergeproof-court-${{ github.event.inputs.pr_number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  court:
    name: PR Court Tick
    # Loop guard: court receipts come from github-actions[bot], which is not on
    # the issue_comment list, and MAX_ROUNDS is enforced by the engine.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.sender.type == 'Bot' &&
       (github.event.sender.login == 'chatgpt-codex-connector[bot]' ||
        github.event.sender.login == 'coderabbitai[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out base branch (authoritative scripts only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base-notary
          persist-credentials: false

      - name: Resolve pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ github.event.inputs.pr_number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$PR_INPUT"
          if [ -z "$pr" ] && [ -n "$RUN_SHA" ]; then
            pr=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          case "$pr" in
            ''|*[!0-9]*) echo "No pull request for this wake-up."; exit 0 ;;
          esac
          pr_json=$(gh api "repos/$REPO/pulls/$pr")
          {
            echo "pr_number=$pr"
            echo "head_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')"
            echo "head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Check out candidate (text data only)
        if: steps.resolve.outputs.head_repo == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        if: steps.resolve.outputs.pr_number != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run court tick
        if: steps.resolve.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          CANDIDATE_DIR: candidate
          WAKE_FROM_NOTARY: ${{ github.event_name == 'workflow_run' && github.event.workflow.name == 'Mergeproof External Notary' && '1' || '0' }}
          AUTO_MERGE: ${{ vars.MIRQL_COURT_AUTO_MERGE }}
          MIRQL_COURT_DISABLED: ${{ vars.MIRQL_COURT_DISABLED }}
          MIRQL_COURT_TOKEN: ${{ secrets.MIRQL_COURT_TOKEN }}
          MIRQL_LLM_BASE_URL: ${{ vars.MIRQL_LLM_BASE_URL }}
          MIRQL_CRITIC_MODEL: ${{ vars.MIRQL_CRITIC_MODEL }}
          MIRQL_ADVOCATE_MODEL: ${{ vars.MIRQL_ADVOCATE_MODEL }}
          MIRQL_JUDGE_MODEL: ${{ vars.MIRQL_JUDGE_MODEL }}
          MIRQL_CRITIC_PROVIDER: ${{ vars.MIRQL_CRITIC_PROVIDER }}
          MIRQL_ADVOCATE_PROVIDER: ${{ vars.MIRQL_ADVOCATE_PROVIDER }}
          MIRQL_JUDGE_PROVIDER: ${{ vars.MIRQL_JUDGE_PROVIDER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node base-notary/scripts/pr-court.mjs
