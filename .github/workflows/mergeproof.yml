name: Mergeproof External Notary

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Re-evaluate when an AI reviewer approves (or an approval is dismissed).
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mergeproof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notary:
    name: Mergeproof Conscience Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate

      - name: Check out base branch (Authoritative Notary, Law 7 & 9)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-notary

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify zero dependencies on candidate
        run: |
          node -e "
            const pkg = require('./candidate/package.json');
            const deps = Object.keys(pkg.dependencies || {}).length;
            const devDeps = Object.keys(pkg.devDependencies || {}).length;
            if (deps > 0 || devDeps > 0) {
              console.error('Violated Zero-Dependency Law: found dependencies in package.json');
              process.exit(1);
            }
          "

      # Phase 0.0a: the candidate's tests run under the BASE notary's runner
      # (MIRQL_TEST_ROOT points it at the candidate tree), so a PR cannot swap
      # the runner that judges it. Falls back to the candidate's runner only
      # during bootstrap, while base does not yet support MIRQL_TEST_ROOT.
      - name: Run Candidate Test Suite (Base-Notary Runner)
        id: head_suite
        working-directory: candidate
        run: |
          if grep -q MIRQL_TEST_ROOT ../base-notary/scripts/run-tests.mjs 2>/dev/null; then
            MIRQL_TEST_ROOT="$PWD" node ../base-notary/scripts/run-tests.mjs
          else
            echo "::warning::base-notary runner lacks MIRQL_TEST_ROOT; bootstrap fallback to the candidate runner"
            node scripts/run-tests.mjs
          fi

      # Law 7 & 16: measure the BASE suite too — its real outcome feeds
      # proof.suite_pass_base. Non-blocking on purpose: a red base is EVIDENCE
      # (the notary must reject a PR that cannot prove improvement from a
      # green base), not a CI infrastructure error.
      - name: Run BASE test suite (Authoritative Measurement, Law 7)
        id: base_suite
        working-directory: base-notary
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/run-tests.mjs

      # Law 6 & 16: every proof field is MEASURED — suite outcomes mirror the
      # step outcomes above (outcome, not conclusion, so continue-on-error reflects
      # true test failure), the diff is the authoritative git diff, phi is
      # computed by the base-notary's own engine, and causal_cycle_completed
      # stays false until a verified reproducer artifact exists in this
      # pipeline (never assumed, never faked).
      # Law 7 & 9: N-1 base-notary executes the evidence builder; falls back to
      # candidate copy only during bootstrap when base does not yet possess it.
      - name: Build Honest PR Evidence (Measured Facts Only)
        env:
          BASE_NOTARY_DIR: ./base-notary
          CANDIDATE_DIR: ./candidate
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SUITE_PASS_BASE: ${{ steps.base_suite.outcome == 'success' }}
          SUITE_PASS_HEAD: ${{ steps.head_suite.outcome == 'success' }}
        run: |
          if [ -f base-notary/scripts/ci-evidence.mjs ]; then
            node base-notary/scripts/ci-evidence.mjs
          else
            node candidate/scripts/ci-evidence.mjs
          fi

      # MP-001: a humanOnly PR may proceed only with an Approve review on the
      # exact head commit from an aiReviewers account in the BASE policy. The
      # notary then runs every other rule, capped at needs_human. Skipped while
      # base has no ci-review-gate.mjs (bootstrap).
      - name: Find AI Reviewer Approval (Base Policy)
        id: ai_review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_NOTARY_DIR: ./base-notary
          REVIEWS_PATH: ./reviews.jsonl
          COMMENTS_PATH: ./comments.jsonl
        run: |
          if [ -f base-notary/scripts/ci-review-gate.mjs ]; then
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' > "$REVIEWS_PATH"
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[]' > "$COMMENTS_PATH"
            node base-notary/scripts/ci-review-gate.mjs
          else
            echo "::notice::base-notary has no ci-review-gate.mjs yet; AI approvals are not considered"
          fi

      - name: Evaluate Mergeproof Notary Gate (Base-Authored Conscience)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_APPROVER: ${{ steps.ai_review.outputs.approver }}
        working-directory: candidate
        # Only auto_merge exits 0, and CI cannot reach auto_merge until a
        # measured causal proof exists (Phase 3). A humanOnly PR approved by an
        # aiReviewers account is capped at needs_human. needs_human and
        # conformance_pass therefore pass this check with a notice: the main
        # ruleset (Phase 0.0c) requires a human review on every PR. A reject or
        # any other failure fails the check.
        run: |
          reviewer_args=()
          if [ -n "$AI_APPROVER" ]; then
            reviewer_args=(--human-only-reviewer "$AI_APPROVER")
          fi
          set +e
          node ../base-notary/bin/mirql.mjs m check \
            --pr ./pr-doc.json \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${reviewer_args[@]}" > verdict.json
          status=$?
          set -e
          cat verdict.json
          verdict=$(node -e "try{const l=require('fs').readFileSync('verdict.json','utf8').trim().split(/\r?\n/).pop();process.stdout.write(JSON.parse(l).verdict??'')}catch{}")
          case "$verdict" in
            auto_merge)
              exit 0 ;;
            needs_human|conformance_pass)
              echo "::notice::mergeproof verdict: $verdict - human review required"
              exit 0 ;;
            *)
              echo "::error::mergeproof verdict: ${verdict:-none} (exit $status)"
              exit 1 ;;
          esac
