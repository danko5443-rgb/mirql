# Path Access Matrix for mirql
# humanOnly (the Courthouse Lock): the laws, the gate wiring and the Judge's own instructions. Any PR modifying these
#   is rejected (MP-001), and only the repository owner's sign-off clears it — an external aiReviewers bot approval
#   leaves it reject (TOUCH_HUMAN_ONLY). With an owner sign-off every other rule still runs and the best verdict is
#   needs_human (never auto_merge). A PR Court receipt
#   (mirql-judge[bot], mirql-critic[bot]) never clears this list.
# humanApprove: Core files that require a reviewer before merging (MP-005). With a reviewer every other rule still
#   runs, Law 13 included, and the best verdict is needs_human.
# aiReviewers: GitHub logins whose Approve review on the PR head commit satisfies the reviewer requirement for
#   humanApprove paths (MP-005) in CI and supplies external findings to the PR Court; it does not clear MP-001
#   (humanOnly) — only the owner's sign-off does. Only the BASE
#   branch's copy of this list is read, so a PR cannot add its own reviewer. The two mirql-* entries are PR Court
#   receipts (docs/pr-court.md), not accounts. Never cleared by AI approval:
#   reviewer config and agent instruction files (.coderabbit.yaml, AGENTS.md, CLAUDE.md, roles/judge.md, ...; see
#   AI_REVIEWER_CONFIG_PATTERNS in packages/mergeproof/evaluator.mjs) and any PR where someone commanded "@coderabbitai
#   approve". Residual risks: a reviewer can be prompt-injected by the diff, and a command comment deleted
#   after it fired is no longer visible to CI. Remove a login from this list to require a human again.
# Owner sign-off: the repository owner's `reviewed:<head sha>` label clears MP-001 and MP-005 in CI on the same terms
#   and with the same reviewer-config exception (scripts/ci-owner-signoff.mjs). It is not a signature: an agent running
#   under the owner's `gh` login can add it too. Unlike an AI approval, it also clears Phi growth (Law 13 PHI_INCREASE),
#   capped at needs_human; it grants no warrant allowance, and refactors must still shrink Phi.

humanOnly:
  - "CONSTITUTION.md"
  - "NOT-ROADMAP.md"
  - "policy/**"
  - ".github/**"
  - "roles/judge.md"
  - ".coderabbit.yaml"
  - ".coderabbit.yml"
  - "AGENTS.md"

humanApprove:
  - "bin/**"
  - "scripts/**"
  - "conformance/**"
  - "schemas/**"
  - "packages/core/**"
  - "packages/log/**"
  - "packages/queue/**"
  - "packages/run/verify*"
  - "packages/run/causal-evidence*"
  - "packages/run/coverage-driver*"
  - "packages/run/authorized-phi*"
  - "packages/run/phi*"
  - "packages/run/anti-cheat*"
  - "packages/run/agent*"
  - "packages/run/worker-diff*"
  - "packages/run/supervisor*"
  - "packages/mergeproof/**"
  - "packages/inbox/keys*"
  - "packages/inbox/merge-approval*"
  - "roles/**"
  - "package.json"
  - ".npmrc"

aiReviewers:
  - "coderabbitai[bot]"
  - "chatgpt-codex-connector[bot]"
  - "mirql-judge[bot]"
  - "mirql-critic[bot]"
