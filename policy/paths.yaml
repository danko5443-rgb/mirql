# Path Access Matrix for mirql
# humanOnly: Files that autonomous agents are strictly forbidden from touching. Any PR modifying these is rejected (MP-001),
#   unless an aiReviewers account approved the exact head commit; then every other rule still runs and the
#   best verdict is needs_human (never auto_merge).
# humanApprove: Core files that require explicit affirmative human authorization before merging.
# aiReviewers: GitHub logins whose Approve review on the PR head commit clears MP-001 in CI. Only the BASE
#   branch's copy of this list is read, so a PR cannot add its own reviewer. Never cleared by AI approval:
#   reviewer config and agent instruction files (.coderabbit.yaml, AGENTS.md, CLAUDE.md, ...; see
#   AI_REVIEWER_CONFIG_PATTERNS in packages/mergeproof/evaluator.mjs) and any PR where someone commanded "@coderabbitai
#   approve". Residual risks: a reviewer can be prompt-injected by the diff, and a command comment deleted
#   after it fired is no longer visible to CI. Remove a login from this list to require a human again.

humanOnly:
  - "CONSTITUTION.md"
  - "NOT-ROADMAP.md"
  - "policy/**"
  - "conformance/**"
  - ".github/**"
  - "scripts/**"
  - "bin/**"
  - ".coderabbit.yaml"
  - ".coderabbit.yml"
  - "AGENTS.md"

humanApprove:
  - "schemas/**"
  - "packages/core/**"
  - "packages/log/**"
  - "packages/queue/**"
  - "packages/run/verify*"
  - "package.json"

aiReviewers:
  - "coderabbitai[bot]"
  - "chatgpt-codex-connector[bot]"
