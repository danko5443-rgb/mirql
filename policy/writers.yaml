# Writer Namespace Authorization Matrix
# Maps each authorized writer namespace to the regex pattern of event types it is permitted to append to the ledger.

writers:
  "tool:queue": "^(job\\.(enqueued|leased|heartbeat|timeout|canceled|promoted)|factory\\.(mode_changed|halted|resumed)|mirql\\.(quiescent|wake))$"
  "tool:run_supervisor": "^(attempt|probe|warrant)\\.[a-z_]+$"
  "tool:log": "^(ledger|log)\\.(snapshot|checkpoint|compacted)$"
  "tool:inbox": "^(human|inbox)\\.[a-z_]+$"
  "human:owner": "^(human\\..*|warrant\\.(created|revoked)|mirql\\.(genesis|halt|resume)|factory\\.resumed)$"
  "notary:mergeproof": "^(verdict\\.(issued|signed|rejected)|merge\\.(executed|refused)|promotion\\.[a-z_]+)$"
  "daemon:lifeguard": "^(lifeguard\\.(heartbeat|circuit_trip|reap|alert)|(promotion|factory|mirql)\\.rollback|factory\\.resumed|mirql\\.resume)$"
